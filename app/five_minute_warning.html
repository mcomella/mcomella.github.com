<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Five Minute Warning</title>
    <style>
        :root {
            font-size: 18pt;
            font-family: system-ui, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            height: 100svh;
            padding: 0 16px;
            box-sizing: border-box;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: lighter;
        }

        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 14rem;
            padding: 18px 16px 18px 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 2px 4px #ccc;
        }

        #settings {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 12px;
        }

        label {
            font-size: 1rem;
        }

        #duration-input {
            width: 100%;
            box-sizing: border-box;
            font-size: 1.2rem;
            text-align: center;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            cursor: pointer;
            margin: 0;
        }

        p {
            margin: 0;
        }

        #duration-running {
            display: none;
            line-height: 1;
            font-size: 4rem;
        }

        button {
            margin-top: 12px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div>
        <h1>Five Minute Warning</h1>
        <form id="container">
            <div id="settings">
                <label for="duration-input">Duration (minutes)</label>
                <input type="text" id="duration-input" name="duration" inputmode="numeric" pattern="[0-9]*" autofocus>
                <label class="checkbox-label" for="halftime-warning-checkbox">
                    <input type="checkbox" id="halftime-warning-checkbox" name="halftime-warning">
                    Warn at halftime (&gt; 10 min)
                </label>
                <label class="checkbox-label" for="keep-screen-on-checkbox">
                    <input type="checkbox" id="keep-screen-on-checkbox" name="keep-screen-on">
                    Keep screen on
                </label>
            </div>
            <p id="duration-running"></p>
            <button id="toggle-timer">START</button>
        </form>
    </div>

    <script>
        function minToMillis(min) {
            return min * 60 * 1000;
        }

        function millisToMin(millis) {
            return millis / 1000 / 60;
        }

        function speak(msg) {
            const utterance = new SpeechSynthesisUtterance(msg);
            speechSynthesis.speak(utterance);
        }

        const STATE_STOPPED = 'STOPPED';
        const STATE_RUNNING = 'RUNNING';
        const STATE_COMPLETE = 'COMPLETE';

        const form = document.querySelector('form');
        const settingsElement = document.querySelector('#settings');
        const halftimeWarningCheckbox = document.getElementById('halftime-warning-checkbox');
        const keepScreenOnCheckbox = document.getElementById('keep-screen-on-checkbox');
        const durationInput = document.querySelector('#duration-input');
        const durationRunningElement = document.querySelector('#duration-running');
        const toggleTimerButton = document.querySelector('#toggle-timer');

        const documentInitialTitle = document.title;
        const toggleTimerButtonInitialText = toggleTimerButton.textContent;

        const STORAGE_KEY_HALFTIME = 'halftime-warning';
        const STORAGE_KEY_DURATION = 'duration';
        const STORAGE_KEY_KEEP_SCREEN_ON = 'keepScreenOn';

        halftimeWarningCheckbox.checked = localStorage.getItem(STORAGE_KEY_HALFTIME) === 'true';
        durationInput.value = localStorage.getItem(STORAGE_KEY_DURATION) ?? '';
        keepScreenOnCheckbox.checked = localStorage.getItem(STORAGE_KEY_KEEP_SCREEN_ON) === 'true';

        halftimeWarningCheckbox.addEventListener('change', () => {
            localStorage.setItem(STORAGE_KEY_HALFTIME, halftimeWarningCheckbox.checked);
        });
        durationInput.addEventListener('input', () => {
            localStorage.setItem(STORAGE_KEY_DURATION, durationInput.value);
        });
        keepScreenOnCheckbox.addEventListener('change', () => {
            localStorage.setItem(STORAGE_KEY_KEEP_SCREEN_ON, keepScreenOnCheckbox.checked);
        });

        // Definition duplicated in stop().
        let state = {
            type: STATE_STOPPED,
        };

        let wakeLock = null;

        async function acquireWakeLock() {
            if (!('wakeLock' in navigator)) {
                console.warn('WAKELOCK: navigator.wakeLock is unavailable; cannot keep screen on');
                return;
            }

            try {
                wakeLock = await navigator.wakeLock.request('screen');
                console.info('WAKELOCK: acquired');
                wakeLock.addEventListener('release', () => {
                    console.info('WAKELOCK: released');
                    wakeLock = null;
                });
            } catch (e) {
                console.error(`WAKELOCK: unable to acquire: ${e}`);
            }
        }

        document.addEventListener('visibilitychange', () => {
            console.debug(`VISIBILITY: ${document.visibilityState}`);

            // The wake lock is automatically released when the tab/app is backgrounded, so reacquire it when it returns.
            if (document.visibilityState === 'visible' && state.type === STATE_RUNNING && keepScreenOnCheckbox.checked) {
                acquireWakeLock();
            }
        });

        toggleTimerButton.addEventListener('click', (e) => {
            function start() {
                const durationMinutes = parseInt(durationInput.value);
                if (!durationMinutes) {
                    alert('ERROR: duration must be an int');
                    return;
                }

                if (keepScreenOnCheckbox.checked) {
                    acquireWakeLock();
                }

                // Fix iOS Safari. It only allows TTS when initially started from a user gesture. We start it here so
                // future utterances occur as expected.
                const unlockUtterance = new SpeechSynthesisUtterance(' ');
                unlockUtterance.volume = 0;
                speechSynthesis.speak(unlockUtterance);

                toggleTimerButton.textContent = 'STOP';
                setFormEnableStateForStopped(false);
                durationRunningElement.textContent = durationMinutes - 1;
                document.title = `${durationMinutes - 1} min | ${documentInitialTitle}`

                const startDate = new Date();
                const endDate = new Date(startDate.getTime() + minToMillis(durationMinutes));

                // We check the time via an interval to handle the computer going to sleep.
                const timerId = setInterval(() => {
                    console.debug('tick');

                    const now = new Date();
                    const remainingMinutes = Math.floor(millisToMin(endDate - now));
                    durationRunningElement.textContent = remainingMinutes;
                    document.title = `${remainingMinutes} min | ${documentInitialTitle}`;

                    if (now >= endDate) {
                        speak('Timer complete');

                        if (state.type === STATE_RUNNING) {
                            state = {
                                type: STATE_COMPLETE,
                                timerId: state.timerId,
                            };
                            console.info(`COMPLETE: at ${new Date().toLocaleTimeString()}`);
                        }

                        return;
                    }

                    // Activate the most recently passed warning, removing it and prior warnings from the list, skipping
                    // activation of them even if they have never been activated (eg device slept through them).
                    // Assumes list is sorted in order of activation.
                    let mostRecentWarning;
                    const warnings = state.sortedWarnings;
                    while (warnings.at(-1) !== undefined && now >= warnings.at(-1).date) {
                        mostRecentWarning = warnings.pop();
                    }

                    if (mostRecentWarning !== undefined) {
                        if (mostRecentWarning.styleBackground) {
                            form.style.background = mostRecentWarning.styleBackground;
                        }

                        speak(mostRecentWarning.spokenText);
                        console.info(`WARNING: ${mostRecentWarning.consoleDescription} at ${new Date().toLocaleTimeString()}`);
                    }
                }, 20 * 1000);

                state = {
                    type: STATE_RUNNING,
                    timerId,
                    // Sorted with the warning that should occur next at the end of the array.
                    sortedWarnings: [],
                };

                if (durationMinutes > 5) {
                    state.sortedWarnings.push({
                        consoleDescription: 'five minute warning',
                        date: new Date(startDate.getTime() + minToMillis(durationMinutes - 5)),
                        spokenText: 'Wrap it up! Five minutes remaining.',
                        styleBackground: '#fc8',
                    });
                }

                if (halftimeWarningCheckbox.checked && (durationMinutes / 2) > 5) {
                    state.sortedWarnings.push({
                        consoleDescription: 'halftime warning',
                        date: new Date(startDate.getTime() + minToMillis(durationMinutes / 2)),
                        spokenText: `Halftime! Roughly ${Math.ceil(durationMinutes / 2)} minutes remaining.`,
                    });
                }

                console.info(`START: ${startDate.toLocaleTimeString()} until ${endDate.toLocaleTimeString()} (${durationMinutes} minutes)`);
                for (const warning of state.sortedWarnings.toReversed()) {
                    console.debug(`  ${warning.consoleDescription} at ${warning.date.toLocaleTimeString()}.`)
                }
            }

            function stop() {
                // Release wakeLock.
                if (wakeLock) {
                    wakeLock.release();
                    wakeLock = null;
                }

                document.title = documentInitialTitle;
                form.style.background = '';
                setFormEnableStateForStopped(true);
                toggleTimerButton.textContent = toggleTimerButtonInitialText;
                speechSynthesis.cancel(); // stop in-progress announcements.

                clearInterval(state.timerId);

                // Definition duplicated with initial setting.
                state = {
                    type: STATE_STOPPED,
                };
            }

            function setFormEnableStateForStopped(isStopped) {
                settingsElement.style.display = isStopped ? 'flex' : 'none';
                durationRunningElement.style.display = isStopped ? 'none' : 'block';
                halftimeWarningCheckbox.disabled = !isStopped;
                (isStopped ? durationInput : toggleTimerButton).focus();
            }

            e.preventDefault();

            if (state.type === STATE_STOPPED) {
                start();
            } else if (state.type === STATE_RUNNING || state.type === STATE_COMPLETE) {
                console.info(`STOP: at ${new Date().toLocaleTimeString()} while ${state.type}`);
                stop();
            } else {
                console.error(`Unknown state ${state.type}`);
            }
        });
    </script>
</body>
</html>
